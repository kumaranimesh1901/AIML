[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-dataset-generator"
version = "0.1.0"
description = "Automated Evaluation Dataset Generator from Production Logs for an e-commerce customer-support assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0.29",
    "alembic>=1.13.1",
    "pgvector>=0.3.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1.18",
]
ml = [
    "sentence-transformers>=3.0.0",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.38",
    "scikit-learn>=1.4.2",
    "scipy>=1.13.0",
    "statsmodels>=0.14.2",
    "datasets>=2.19.0",
    "spacy>=3.7.4",
]
dashboard = [
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
edg = "edg.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "llm: integration tests that require a live LLM backend such as Ollama",
]

[tool.coverage.run]
source = ["src/edg"]
omit = ["src/edg/migrations/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

